pre-commit:
  commands:
    lint-format:
      glob: "*.{ts,tsx,js,jsx,json}"
      run: npx biome check --write --unsafe {staged_files}
      stage_fixed: true

pre-push:
  commands:
    typecheck:
      run: npm run typecheck
    lint:
      run: npm run lint
    lockfile-sync:
      run: node scripts/check-lockfile.js
